services:
  browser-publisher:
    build: .
    image: ghcr.io/virgooooox/browser-publisher:0.2.0
    container_name: browser-publisher
    restart: unless-stopped
    environment:
      PUBLISHER_ACCESS_TOKEN: "${PUBLISHER_ACCESS_TOKEN:?set access token}"
      PUBLISHER_DATA_DIR: /app/data
      PUBLISHER_HEADLESS: "true"
      PUBLISHER_WECHAT_MP_DEFAULT_MODE: "publish"
      # Official WeChat MP API credentials belong to Browser Publisher.
      # Leave them empty to use the legacy Playwright draft-editor fallback.
      PUBLISHER_WECHAT_MP_APP_ID: "${PUBLISHER_WECHAT_MP_APP_ID:-}"
      PUBLISHER_WECHAT_MP_APP_SECRET: "${PUBLISHER_WECHAT_MP_APP_SECRET:-}"
      PUBLISHER_WECHAT_MP_API_BASE_URL: "${PUBLISHER_WECHAT_MP_API_BASE_URL:-https://api.weixin.qq.com}"
      PUBLISHER_WECHAT_MP_AUTHOR: "${PUBLISHER_WECHAT_MP_AUTHOR:-Notify Hub}"
      PUBLISHER_XHS_DEFAULT_MODE: "draft"
      PUBLISHER_XHS_MIN_INTERVAL_SECONDS: "1800"
      PUBLISHER_CONSOLE_PUBLIC_URL: "${PUBLISHER_CONSOLE_PUBLIC_URL:-http://192.168.31.100:8790}"
      PUBLISHER_NOTIFY_EVENT_URL: "${PUBLISHER_NOTIFY_EVENT_URL:-}"
      PUBLISHER_NOTIFY_API_KEY: "${PUBLISHER_NOTIFY_API_KEY:-}"
      PUBLISHER_NOTIFY_RECIPIENT_IDS: "${PUBLISHER_NOTIFY_RECIPIENT_IDS:-}"
    ports:
      - "${PUBLISHER_BIND_IP:-0.0.0.0}:8790:8790"
    volumes:
      - ./data:/app/data
    shm_size: "1gb"
    init: true
    security_opt:
      - no-new-privileges:true
